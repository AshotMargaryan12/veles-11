# Словарь эвристики гео аудитории (раздел 4.4 ТЗ). Редактируется без правки кода.
#
# countries.<ISO2>:
#   name       — как страна пишется в карточке
#   name_en    — как страна пишется в черновике заявки на английском
#   region     — регион для региональной CPA-ставки (cpa_by_country.csv, строки с *)
#   languages  — язык контента -> насколько он указывает на страну (0..1).
#                Коды языков: ru uk be kk uz az ky tg ar fa ur tr en es pt fr de it
#                pl id vi th ko ja zh hi bn he ka hy
#   markers    — местные реалии: валюты, банки, платёжки, госсервисы, города.
#                Без учёта регистра. Латинские маркеры ищутся целым словом
#                (payme не находится в payments); кириллические до 4 букв — с
#                начала слова (сбер -> сбербанк, но не «индия» для «дия»),
#                остальные — подстрокой.
#                Префикс re: — регулярное выражение (для валютных кодов, которые
#                совпадают с обычными словами: re:\d\s?tl\b — «500 TL», но не «TL;DR»).

countries:
  # --- СНГ: отдельные маркеры для RU / UA / KZ / BY (раздел 4.4, п. 4) ---
  RU:
    name: Россия
    name_en: Russia
    region: CIS
    languages: {ru: 0.6}
    markers: [рубл, "₽", "руб.", сбер, тинькофф, т-банк, втб, альфа-банк, газпромбанк,
              госуслуг, сбп, юmoney, юмани, "цб рф", банк россии, фнс, ндфл, мосбирж,
              "иис", москв, петербург, питер, новосибирск, екатеринбург, казан, "рф ",
              wildberries, "ozon"]
  UA:
    name: Украина
    name_en: Ukraine
    region: CIS
    languages: {uk: 1.0, ru: 0.2}
    markers: [грн, гривн, "₴", монобанк, monobank, "mono ", приватбанк, privatbank,
              ощадбанк, "дія", "дия", нова пошта, "фоп", "нбу", київ, киев, харків,
              харьков, одес, львів, львов, дніпр, днепр, запоріж, "україн", "украин"]
  KZ:
    name: Казахстан
    name_en: Kazakhstan
    region: CIS
    languages: {kk: 1.0, ru: 0.12}
    markers: [тенге, "₸", "kzt", kaspi, каспи, halyk, халык, "иин", egov, алматы,
              астана, шымкент, караганд, "kase", "aifc", "мфца", "казахстан"]
  BY:
    name: Беларусь
    name_en: Belarus
    region: CIS
    languages: {be: 1.0, ru: 0.08}
    markers: ["byn", "бел. руб", белорусск, ерип, беларусбанк, приорбанк, белинвестбанк,
              мтбанк, "нбрб", минск, гомел, брест, гродн, витебск, "беларус"]
  UZ:
    name: Узбекистан
    name_en: Uzbekistan
    region: CIS
    languages: {uz: 1.0, ru: 0.03}
    markers: ["so'm", "сўм", "uzs", payme, "click.uz", uzcard, humo, ташкент, toshkent,
              самарканд, "o'zbekiston", "узбекистан"]
  KG:
    name: Кыргызстан
    name_en: Kyrgyzstan
    region: CIS
    languages: {ky: 1.0, ru: 0.02}
    markers: ["kgs", бишкек, "кыргызстан", "мбанк", "mbank", "элсом"]
  AZ:
    name: Азербайджан
    name_en: Azerbaijan
    region: CIS
    languages: {az: 1.0}
    markers: [manat, "azn", bakı, баку, "azərbaycan", "kapital bank"]

