[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veles-kol-tools"
version = "0.2.0"
description = "Хантинг Telegram-каналов (tghunter) и квалификатор партнёров (qualify)"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.34,<2.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "anthropic>=1.0",
    "yt-dlp>=2025.1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
qualify = "qualifier.cli:main"
tghunter = "tghunter.cli:main"

[tool.setuptools.packages.find]
include = ["tghunter*", "qualifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
